<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Cat Body -->
  <ellipse cx="100" cy="130" rx="45" ry="35" fill="#FF8C42" stroke="#D67326" stroke-width="2"/>

  <!-- Cat Head -->
  <circle cx="100" cy="80" r="35" fill="#FF8C42" stroke="#D67326" stroke-width="2"/>

  <!-- Cat Ears -->
  <path d="M75 60 L85 40 L95 60 Z" fill="#FF8C42" stroke="#D67326" stroke-width="2"/>
  <path d="M105 60 L115 40 L125 60 Z" fill="#FF8C42" stroke="#D67326" stroke-width="2"/>

  <!-- Inner Ears -->
  <path d="M80 55 L85 45 L90 55 Z" fill="#FFB380"/>
  <path d="M110 55 L115 45 L120 55 Z" fill="#FFB380"/>

  <!-- Cat Eyes -->
  <ellipse cx="90" cy="75" rx="6" ry="8" fill="#000"/>
  <ellipse cx="110" cy="75" rx="6" ry="8" fill="#000"/>
  <ellipse cx="92" cy="73" rx="2" ry="3" fill="#FFF"/>
  <ellipse cx="112" cy="73" rx="2" ry="3" fill="#FFF"/>

  <!-- Cat Nose -->
  <path d="M100 85 L95 90 L105 90 Z" fill="#FF6B9D"/>

  <!-- Cat Mouth -->
  <path d="M100 92 Q95 97 90 95" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round"/>
  <path d="M100 92 Q105 97 110 95" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round"/>

  <!-- Cat Whiskers -->
  <line x1="65" y1="80" x2="85" y2="78" stroke="#000" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="65" y1="85" x2="85" y2="85" stroke="#000" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="65" y1="90" x2="85" y2="92" stroke="#000" stroke-width="1.5" stroke-linecap="round"/>

  <line x1="115" y1="78" x2="135" y2="80" stroke="#000" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="115" y1="85" x2="135" y2="85" stroke="#000" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="115" y1="92" x2="135" y2="90" stroke="#000" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Cat Legs -->
  <rect x="75" y="155" width="12" height="25" rx="6" fill="#FF8C42" stroke="#D67326" stroke-width="2"/>
  <rect x="95" y="155" width="12" height="25" rx="6" fill="#FF8C42" stroke="#D67326" stroke-width="2"/>
  <rect x="115" y="155" width="12" height="25" rx="6" fill="#FF8C42" stroke="#D67326" stroke-width="2"/>
  <rect x="135" y="155" width="12" height="25" rx="6" fill="#FF8C42" stroke="#D67326" stroke-width="2"/>

  <!-- Cat Paws -->
  <ellipse cx="81" cy="185" rx="8" ry="5" fill="#D67326"/>
  <ellipse cx="101" cy="185" rx="8" ry="5" fill="#D67326"/>
  <ellipse cx="121" cy="185" rx="8" ry="5" fill="#D67326"/>
  <ellipse cx="141" cy="185" rx="8" ry="5" fill="#D67326"/>

  <!-- Cat Tail -->
  <path d="M145 130 Q165 120 170 105 Q175 90 165 80" fill="none" stroke="#FF8C42" stroke-width="15" stroke-linecap="round"/>

  <!-- Cat Belly -->
  <ellipse cx="100" cy="135" rx="25" ry="20" fill="#FFB380"/>
</svg>